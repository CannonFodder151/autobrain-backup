name: build-hosted

# AUT-2382: build the autobrain-backup image for the Oracle Hosted stack
# (Portainer EP5). Pushes a multi-arch (amd64 + arm64) manifest tagged :hosted
# to GHCR. The autobrain-backup service is otherwise published by publish.yml
# (:latest / :vX.Y.Z on the x64 self-hosted runner) which produces amd64-only
# — that breaks exec on arm64 (AUT-967 family).
#
# AUT-5654: runs on the repo's self-hosted x64 runner (gh-runner-autobrain-backup,
# online, docker + buildx + qemu via docker/setup-qemu-action). GitHub-hosted
# runners are in outage, so the multi-arch build moved to self-hosted.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: hosted)'
        required: false
        default: hosted
  push:
    branches: [main]

concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "ghcr.io/cannonfodder151/autobrain-backup:${TAG}" \
            .
          echo "==> pushed ghcr.io/cannonfodder151/autobrain-backup:${TAG}"

      - name: Verify manifest platforms
        # Uses docker buildx imagetools inspect to a temp file instead of a raw curl
        # to ghcr.io which requires a token exchange that GITHUB_TOKEN alone cannot perform.
        # The build+push step succeeds (auth via docker/login-action handles the exchange),
        # but the verification curl gets 'invalid token' and fails even though the image
        # was successfully pushed as multi-arch.
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          img="ghcr.io/cannonfodder151/autobrain-backup:${TAG}"
          echo "==> verifying $img"
          docker buildx imagetools inspect "$img" --raw \
            > /tmp/manifest.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/manifest.json"))
          archs = sorted((m["platform"]["architecture"], m["platform"]["os"]) for m in d["manifests"])
          assert ("amd64","linux") in archs, ("amd64 missing", archs)
          assert ("arm64","linux") in archs, ("arm64 missing", archs)
          print("verified platforms:", archs)
          PY

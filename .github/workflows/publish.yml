name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DH_IMAGE: cannonfodder151/autobrain-backup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            echo "ghcr_tags=$GHCR_IMAGE:${VER},$GHCR_IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "dh_tags=$DH_IMAGE:${VER},$DH_IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            SHA="${GITHUB_SHA::12}"
            echo "ghcr_tags=$GHCR_IMAGE:latest,$GHCR_IMAGE:$SHA" >> "$GITHUB_OUTPUT"
            echo "dh_tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.ghcr_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: steps.meta.outputs.dh_tags != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: steps.meta.outputs.dh_tags != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.dh_tags }}
          cache-from: type=gha
